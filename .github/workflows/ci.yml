name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install pyyaml
      - run: python -m unittest discover -s tests
      - run: python -m reqviewer --root examples/sample
      - run: pip install .
      - run: reqviewer --root examples/sample --out ${{ runner.temp }}/viewer.html

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pyyaml
      - run: python -m unittest discover -s tests
      - run: pip install .
      - run: reqviewer --root examples/sample --out ${{ runner.temp }}/viewer.html

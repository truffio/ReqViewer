[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "reqviewer"
description = "Write a self-contained requirements viewer page from Markdown files."
dynamic = ["version"]
requires-python = ">=3.11"
dependencies = []
license = "MIT"
readme = "README.md"

[project.optional-dependencies]
yaml = ["pyyaml"]

[project.scripts]
reqviewer = "reqviewer.cli:main"

[tool.setuptools.dynamic]
version = { attr = "reqviewer.__version__" }

[tool.setuptools]
packages = ["reqviewer"]

[tool.setuptools.package-data]
reqviewer = ["template.html"]
